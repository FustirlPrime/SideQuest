<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARD SIDEQUESTS — Level 99 Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #2a2a3a;
    --accent: #f5c400;
    --accent2: #ff4f1f;
    --accent3: #00e5ff;
    --green: #39ff14;
    --text: #e8e8f0;
    --muted: #7a7a9a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.5;
  }

  header {
    padding: 60px 24px 40px;
    text-align: center;
    position: relative;
  }

  header::after {
    content: '';
    display: block;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    margin-top: 40px;
  }

  .tag {
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent2);
    border: 1px solid var(--accent2);
    padding: 4px 12px;
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Black Ops One', sans-serif;
    font-size: clamp(42px, 10vw, 90px);
    line-height: 0.9;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 60%, #ff008c 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .subtitle {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .budget-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    margin-top: 28px;
  }

  .budget-pill {
    background: rgba(245,196,0,0.08);
    border: 1px solid var(--accent);
    border-radius: 2px;
    padding: 8px 20px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
  }

  /* Filter bar */
  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 24px 24px 0;
    max-width: 1200px;
    margin: 0 auto;
  }

  .filter-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 18px;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(245,196,0,0.06);
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    padding: 32px 24px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    animation: fadeIn 0.4s ease both;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--cat-color, var(--accent));
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 24px rgba(245,196,0,0.06);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-accent-bar {
    height: 3px;
    background: var(--cat-color, var(--accent));
  }

  .card-header {
    padding: 20px 20px 12px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .quest-num {
    font-family: 'Black Ops One', sans-serif;
    font-size: 11px;
    color: var(--cat-color, var(--accent));
    letter-spacing: 2px;
    min-width: 32px;
    padding-top: 3px;
    opacity: 0.7;
  }

  .card-title-block { flex: 1; }

  .card-category {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cat-color, var(--accent));
    margin-bottom: 4px;
  }

  .card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    line-height: 1.1;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text);
  }

  .card-emoji {
    font-size: 28px;
    line-height: 1;
    flex-shrink: 0;
  }

  .card-tagline {
    padding: 0 20px 12px;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.4;
  }

  .meta-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 0 20px 16px;
  }

  .meta-chip {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 2px;
  }

  .chip-diff {
    background: rgba(255,79,31,0.12);
    border: 1px solid rgba(255,79,31,0.3);
    color: var(--accent2);
  }
  .chip-diff.easy { background: rgba(57,255,20,0.08); border-color: rgba(57,255,20,0.3); color: var(--green); }
  .chip-diff.medium { background: rgba(0,229,255,0.08); border-color: rgba(0,229,255,0.3); color: var(--accent3); }

  .chip-budget {
    background: rgba(245,196,0,0.1);
    border: 1px solid rgba(245,196,0,0.3);
    color: var(--accent);
  }

  .chip-walk {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 20px;
  }

  .card-body {
    padding: 16px 20px 20px;
  }

  .section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .needs-list {
    list-style: none;
    margin-bottom: 16px;
  }

  .needs-list li {
    font-size: 13px;
    color: var(--text);
    padding: 3px 0 3px 16px;
    position: relative;
    line-height: 1.4;
  }

  .needs-list li::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: var(--cat-color, var(--accent));
    font-size: 10px;
    top: 5px;
  }

  .steps-list {
    list-style: none;
    counter-reset: steps;
  }

  .steps-list li {
    counter-increment: steps;
    font-size: 13px;
    color: var(--text);
    padding: 5px 0 5px 28px;
    position: relative;
    line-height: 1.4;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }

  .steps-list li:last-child { border-bottom: none; }

  .steps-list li::before {
    content: counter(steps);
    position: absolute;
    left: 0;
    width: 20px;
    height: 20px;
    background: var(--cat-color, var(--accent));
    color: var(--bg);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    top: 5px;
  }

  .pro-tip {
    margin-top: 14px;
    background: rgba(245,196,0,0.05);
    border-left: 2px solid var(--accent);
    padding: 10px 12px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    border-radius: 0 2px 2px 0;
  }

  .pro-tip strong { color: var(--accent); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; font-size: 10px; text-transform: uppercase; }

  /* Expand toggle */
  .expand-btn {
    width: 100%;
    background: transparent;
    border: none;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 12px;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .expand-btn:hover {
    color: var(--text);
    background: rgba(255,255,255,0.03);
  }

  .expand-btn .arrow {
    display: inline-block;
    transition: transform 0.25s;
    font-size: 10px;
  }

  .card.expanded .arrow { transform: rotate(180deg); }

  .card-details {
    display: none;
    border-top: 1px solid var(--border);
  }

  .card.expanded .card-details { display: block; }

  /* Legend */
  .legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 24px 32px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }

  .card[data-cat="sport"] { --cat-color: var(--accent2); }
  .card[data-cat="chill"] { --cat-color: var(--accent3); }
  .card[data-cat="gaming"] { --cat-color: var(--green); }
  .card[data-cat="food"] { --cat-color: var(--accent); }
  .card[data-cat="wild"] { --cat-color: #d966ff; }

  .hidden { display: none !important; }

  footer {
    text-align: center;
    padding: 32px;
    border-top: 1px solid var(--border);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  footer span { color: var(--accent); }

  /* Wheel Overlay */
  .wheel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 15, 0.95);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(10px);
  }
  .wheel-overlay.active {
    opacity: 1;
    pointer-events: all;
  }
  .close-wheel {
    position: absolute;
    top: 30px;
    right: 30px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 30px;
    cursor: pointer;
    z-index: 10000;
  }
  .wheel-container {
    position: relative;
    width: 90vw;
    max-width: 500px;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #wheelCanvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(245,196,0,0.2);
    transition: transform 4s cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  .wheel-pointer {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 50px;
    color: var(--accent);
    z-index: 10;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
  }
  .spin-btn {
    font-family: 'Black Ops One', sans-serif;
    font-size: 24px;
    padding: 16px 40px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    border: none;
    border-radius: 4px;
    color: var(--bg);
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(255,79,31,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .spin-btn:hover {
    box-shadow: 0 6px 20px rgba(255,79,31,0.6);
  }
  .spin-btn:active {
    transform: scale(0.95);
  }
  .spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .winner-popup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: var(--card);
    border: 2px solid var(--accent);
    padding: 40px;
    border-radius: 8px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    width: 90%;
    max-width: 400px;
    z-index: 20;
  }
  .winner-popup.active {
    opacity: 1;
    pointer-events: all;
    transform: translate(-50%, -50%) scale(1);
  }
  #winnerText {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 32px;
    line-height: 1.1;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <div class="tag">■ Real-Life Chaos Challenges ■</div>
  <h1>Hard<br>Sidequests</h1>
  <p class="subtitle">Level 99 Edition — 3 Players · 30 Missions</p>
  <div class="budget-bar">
    <div class="budget-pill">💰 Max 10€ / person</div>
    <div class="budget-pill">👥 30€ total group</div>
    <div class="budget-pill">🥾 5km max walking</div>
    <div class="budget-pill">🏆 30€ / person overall</div>
  </div>
  <div style="margin-top: 40px; margin-bottom: -10px;">
    <button class="spin-btn" style="font-size: 20px; padding: 12px 30px;" onclick="openWheel()">🎲 SPIN FOR RANDOM QUEST 🎲</button>
  </div>
</header>

<div class="filters">
  <button class="filter-btn active" onclick="filter('all', this)">All (30)</button>
  <button class="filter-btn" onclick="filter('sport', this)">🔥 Sport</button>
  <button class="filter-btn" onclick="filter('chill', this)">🌿 Chill</button>
  <button class="filter-btn" onclick="filter('gaming', this)">🎮 Gaming</button>
  <button class="filter-btn" onclick="filter('food', this)">🍖 Food</button>
  <button class="filter-btn" onclick="filter('wild', this)">💀 Wild</button>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent2)"></div> Sport</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent3)"></div> Chill</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Gaming</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div> Food</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d966ff"></div> Wild</div>
</div>

<div class="grid" id="grid"></div>

<div class="wheel-overlay" id="wheelOverlay">
  <button class="close-wheel" onclick="closeWheel()">✕</button>
  <div class="wheel-container">
    <div class="wheel-pointer">▼</div>
    <canvas id="wheelCanvas" width="600" height="600"></canvas>
  </div>
  <button class="spin-btn" id="spinBtn" onclick="spinWheel()" style="margin-top: 40px;">SPIN THE WHEEL</button>
  
  <div class="winner-popup" id="winnerPopup">
    <div style="font-size: 50px; margin-bottom: 10px;" id="winnerEmoji">🎉</div>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: var(--accent); margin-bottom: 8px; text-transform: uppercase;" id="winnerCat">Category</div>
    <h2 id="winnerText">Quest Name</h2>
    <p id="winnerTagline" style="color: var(--muted); margin-bottom: 24px; font-style: italic; font-size: 14px; line-height: 1.4;"></p>
    <button class="filter-btn active" style="padding: 12px 24px; font-size: 16px; border-color: var(--accent); color: var(--accent); background: rgba(245,196,0,0.1);" onclick="closeWheelAndShow(winnerId)">ACCEPT QUEST</button>
  </div>
</div>

<footer>Complete all 30 · Stay safe · <span>Make memories</span> · Level 99 Champions</footer>

<script>
const quests = [
  {
    id: 1,
    cat: "food",
    emoji: "🔥",
    title: "Guerrilla BBQ",
    tagline: "A park, a grill, zero restaurants. The holy trio of meat, smoke, and chaos.",
    diff: "easy",
    diffLabel: "Easy",
    budget: "~6€/person",
    walk: "0–1 km",
    needs: [
      "Disposable BBQ grill (≈3€ at supermarket)",
      "Sausages / chicken skewers (~10€ split 3 ways)",
      "Bread rolls (1€)",
      "Mustard, ketchup (shared cost)",
      "Salt, pepper, tinfoil (from home)",
      "A park with fire allowed OR a firepit spot"
    ],
    steps: [
      "Scout your park — look for fire-allowed zones or a designated BBQ area.",
      "Buy the disposable grill and split the meat budget: aim for 2–3 items per person.",
      "Light the grill 20 minutes before you want to eat. Fan it or blow through a straw.",
      "Season everything before it hits the grill. Do not skip this.",
      "Cook sausages first (forgiving), then any marinated pieces.",
      "Eat standing up like warriors. Bonus points for eating directly off the grill with sticks.",
      "Leave zero trace. Take the cold grill with you."
    ],
    tip: "Marinate the chicken the night before in olive oil, garlic, paprika, and lemon. Game changer for €0 extra."
  },
  {
    id: 2,
    cat: "wild",
    emoji: "💀",
    title: "Trash Bag Slip N Slide",
    tagline: "Summer's most chaotic downgrade of engineering. Requires: a hill and zero dignity.",
    diff: "medium",
    diffLabel: "Medium",
    budget: "~4€/person",
    walk: "1–2 km",
    needs: [
      "6–10 heavy-duty black trash bags (~2€)",
      "1 roll duct tape (~2€)",
      "Garden hose or 4x 10L buckets of water",
      "Dish soap — Dawn or generic (~1€)",
      "A smooth grassy hill, 20–40ft, no rocks",
      "Old clothes or bathing suit"
    ],
    steps: [
      "Walk the entire hill and runout zone. Remove every rock, stick, and sprinkler head.",
      "Lay trash bags end-to-end overlapping 6 inches. Tape all seams tight.",
      "Tape up the sides to create a channel so you don't slide off.",
      "Soak the whole surface — absolutely soaking wet.",
      "Apply a generous line of dish soap down the center. More than you think.",
      "Sprint start: dive stomach-first or slide feet-first. One person wets the slide during use.",
      "Re-soap every 5–6 runs."
    ],
    tip: "Add a kiddie pool or tarp at the bottom as a landing zone. Two bags wide = side-by-side racing."
  },
  {
    id: 3,
    cat: "chill",
    emoji: "⛺",
    title: "Hike & Camp the Hill",
    tagline: "5km round trip. Big views. Sleep under stars. Costs less than a pizza.",
    diff: "easy",
    diffLabel: "Easy",
    budget: "~5€/person",
    walk: "≤5 km round trip",
    needs: [
      "Small 20–30L daypack each",
      "1-person tent or bivy (borrow or share)",
      "Sleeping bag rated for the night temp",
      "Water 1.5L, instant noodles or freeze-dried meal (~2€)",
      "Headlamp, lighter",
      "Extra jacket — hilltops are cold"
    ],
    steps: [
      "Find your hill via AllTrails or 'camping allowed hills near me'. Aim for 2–3km up.",
      "Leave late afternoon to arrive at the top with 1 hour of daylight left.",
      "Set up your tent BEFORE dark. Seriously.",
      "Cook your meal. Watch the sunset. It's literally the whole point.",
      "Cowboy camp if the sky is clear (sleeping bag only, no tent). Peak experience.",
      "Stargaze. Download a star map app (Sky Map, Stellarium — free).",
      "Pack out everything. Head back at sunrise."
    ],
    tip: "Bring a small speaker. Summit music hits completely different at 600m elevation."
  },
  {
    id: 4,
    cat: "sport",
    emoji: "⚡",
    title: "Turbo Shopping Cart",
    tagline: "Speed. Wheels. Glory. Build a motorized cart and hit the open (private) asphalt.",
    diff: "hard",
    diffLabel: "Hard",
    budget: "€€€ (shared project ~25–30€ parts)",
    walk: "0 km (you drive)",
    needs: [
      "1 sturdy metal shopping cart (owner's permission)",
      "2–4 power wheels or scooter motors (12–24V)",
      "24V LiPo or deep cycle battery",
      "ESC (electronic speed controller)",
      "E-bike throttle trigger",
      "Steel angle iron + bolts for motor mounts",
      "Rubber-coated drive wheels",
      "Helmet, knee pads, gloves — mandatory"
    ],
    steps: [
      "Strip any plastic from the lower frame to expose wheel hubs.",
      "Fabricate motor mounts so the drive wheel presses against rear cart wheels.",
      "Wire motors to the ESC; connect battery with inline fuse.",
      "Mount throttle on handlebar. Use zip ties to route wiring neatly.",
      "Install a big red kill switch on the frame. Non-negotiable.",
      "Test at low speed in a flat open area first.",
      "Once it handles well: film absolutely everything."
    ],
    tip: "Friction drive (rubber wheel pressing cart wheel) requires zero welding. Keep it under 25 mph."
  },
  {
    id: 5,
    cat: "gaming",

function renderCard(q, idx) {
  const diffClass = q.diff === 'easy' ? 'easy' : q.diff === 'medium' ? 'medium' : '';
  const catLabel = { sport: '🔥 Sport', chill: '🌿 Chill', gaming: '🎮 Gaming', food: '🍖 Food', wild: '💀 Wild' }[q.cat];
  return `
  <div class="card" data-cat="${q.cat}" style="animation-delay:${idx * 0.06}s">
    <div class="card-accent-bar"></div>
    <div class="card-header">
      <div class="quest-num">#${String(q.id).padStart(2,'0')}</div>
      <div class="card-title-block">
        <div class="card-category">${catLabel}</div>
        <div class="card-title">${q.title}</div>
      </div>
      <div class="card-emoji">${q.emoji}</div>
    </div>
    <div class="card-tagline">${q.tagline}</div>
    <div class="meta-row">
      <div class="meta-chip chip-diff ${diffClass}">${q.diffLabel}</div>
      <div class="meta-chip chip-budget">${q.budget}</div>
      <div class="meta-chip chip-walk">🥾 ${q.walk}</div>
    </div>
    <button class="expand-btn" onclick="toggle(this)">
      What You Need & Steps <span class="arrow">▼</span>
    </button>
    <div class="card-details">
      <div class="card-body">
        <div class="section-label">What You Need</div>
        <ul class="needs-list">${q.needs.map(n=>`<li>${n}</li>`).join('')}</ul>
        <div class="section-label">How To Do It</div>
        <ol class="steps-list">${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
        <div class="pro-tip"><strong>⭐ Pro Tip</strong><br>${q.tip}</div>
      </div>
    </div>
  </div>`;
}

function toggle(btn) {
  const card = btn.closest('.card');
  card.classList.toggle('expanded');
  btn.querySelector('.arrow').style.transform = card.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
  const details = card.querySelector('.card-details');
  details.style.display = card.classList.contains('expanded') ? 'block' : 'none';
}

function filter(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.card').forEach(c => {
    if (cat === 'all' || c.dataset.cat === cat) {
      c.classList.remove('hidden');
    } else {
      c.classList.add('hidden');
    }
  });
}

const grid = document.getElementById('grid');
grid.innerHTML = quests.map((q, i) => renderCard(q, i)).join('');

// --- WHEEL LOGIC ---
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas ? canvas.getContext('2d') : null;
let currentRotation = 0;
let isSpinning = false;
let winnerId = null;

const catColors = {
  sport: '#ff4f1f',
  chill: '#00e5ff',
  gaming: '#39ff14',
  food: '#f5c400',
  wild: '#d966ff'
};

const catLabels = {
  sport: '🔥 Sport',
  chill: '🌿 Chill',
  gaming: '🎮 Gaming',
  food: '🍖 Food',
  wild: '💀 Wild'
};

function drawWheel() {
  if (!ctx) return;
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const radius = canvas.width / 2;
  const sliceAngle = (2 * Math.PI) / quests.length;
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  quests.forEach((q, i) => {
    const startAngle = i * sliceAngle;
    const endAngle = startAngle + sliceAngle;
    
    // Draw slice
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
    ctx.closePath();
    
    ctx.fillStyle = catColors[q.cat] || '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#0a0a0f';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Draw text
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(startAngle + sliceAngle / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#0a0a0f';
    ctx.font = '900 22px "Barlow Condensed"';
    ctx.fillText('#' + q.id, radius - 20, 0);
    ctx.restore();
  });
  
  // Draw center dot
  ctx.beginPath();
  ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
  ctx.fillStyle = '#0a0a0f';
  ctx.fill();
  ctx.strokeStyle = '#f5c400';
  ctx.lineWidth = 4;
  ctx.stroke();
}

function openWheel() {
  document.getElementById('wheelOverlay').classList.add('active');
  drawWheel();
}

function closeWheel() {
  if (isSpinning) return; // Prevent closing while spinning
  document.getElementById('wheelOverlay').classList.remove('active');
  document.getElementById('winnerPopup').classList.remove('active');
}

function spinWheel() {
  if (isSpinning) return;
  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('winnerPopup').classList.remove('active');
  
  // Random spins (5 to 10 full rotations + random angle)
  const spins = 5 + Math.random() * 5;
  const degrees = spins * 360;
  currentRotation += degrees;
  
  canvas.style.transform = `rotate(${currentRotation}deg)`;
  
  setTimeout(() => {
    isSpinning = false;
    document.getElementById('spinBtn').disabled = false;
    
    const normalizedRotation = currentRotation % 360;
    const sliceAngle = 360 / quests.length;
    const pointerAngle = 270;
    const offset = (pointerAngle - normalizedRotation + 360) % 360;
    const winnerIndex = Math.floor(offset / sliceAngle);
    
    const winner = quests[winnerIndex];
    winnerId = winner.id;
    
    document.getElementById('winnerEmoji').innerText = winner.emoji;
    document.getElementById('winnerCat').innerText = catLabels[winner.cat];
    document.getElementById('winnerText').innerText = winner.title;
    document.getElementById('winnerTagline').innerText = winner.tagline;
    
    document.getElementById('winnerPopup').classList.add('active');
    
  }, 4000); // matches CSS transition time
}

function closeWheelAndShow(id) {
  closeWheel();
  
  // Reset filters to ALL
  const allBtn = document.querySelector('.filter-btn[onclick*="all"]');
  if(allBtn) filter('all', allBtn);
  
  setTimeout(() => {
    const cards = document.querySelectorAll('.card');
    let targetCard = null;
    cards.forEach(c => {
      const numEl = c.querySelector('.quest-num');
      if (numEl && numEl.innerText.includes('#' + String(id).padStart(2,'0'))) {
        targetCard = c;
      }
    });
    
    if (targetCard) {
      if (!targetCard.classList.contains('expanded')) {
        targetCard.querySelector('.expand-btn').click();
      }
      targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      
      const originalShadow = targetCard.style.boxShadow;
      targetCard.style.boxShadow = '0 0 40px var(--cat-color)';
      targetCard.style.borderColor = 'var(--cat-color)';
      setTimeout(() => {
        targetCard.style.boxShadow = originalShadow;
        targetCard.style.borderColor = '';
      }, 3000);
    }
  }, 400);
}
